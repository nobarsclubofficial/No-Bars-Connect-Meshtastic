name: Build Preview APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: cp .env.ci .env

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Generate client environment
        run: dart run tool/generate_client_env.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Rename preview APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/no-bars-command-preview.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: no-bars-command-android-preview
          path: build/app/outputs/flutter-apk/no-bars-command-preview.apk
          if-no-files-found: error
          retention-days: 14
